[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drnowhami-intentdrift"
version = "0.1.0"
description = "比对原查询与改写查询的核心意图，标出实体或目标被替换的情况"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "drnowhami" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://drnowhami.github.io"
Repository = "https://github.com/drnowhami/intentdrift"
Issues = "https://github.com/drnowhami/intentdrift/issues"

[project.scripts]
intentdrift = "intentdrift:main"

[tool.setuptools]
py-modules = ["intentdrift"]
